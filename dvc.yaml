stages:
  fetch:
    cmd: uv run python src/data/fetch_spin_data.py
    deps:
      - src/data/fetch_spin_data.py
    params:
      - fetch.url
    outs:
      - data/raw/lokacija.json:
          cache: false
    always_changed: true

  preprocess:
    cmd: uv run python src/data/process_spin_data.py
    deps:
      - src/data/process_spin_data.py
      - data/raw/lokacija.json
    params:
      - preprocess.station
    outs:
      - data/preprocessed/nesrece_v_cestnem_prometu.csv:
          cache: false

  fetch_vreme:
      cmd: uv run python src/data/obcina_vreme.py
      deps:
        - src/data/obcina_vreme.py
      params:
        - fetch_vreme.days_back
        - fetch_vreme.request_sleep
        - fetch_vreme.obcine_path
        - fetch_vreme.url
      always_changed: true
      outs:
        - data/raw/obcina_vreme.csv:
            cache: false

  preprocess_vreme:
      cmd: uv run python src/data/process_obcina_vreme.py
      deps:
        - src/data/process_obcina_vreme.py
        - data/raw/obcina_vreme.csv
      params:
        - preprocess_vreme.raw_path
        - preprocess_vreme.processed_path
      outs:
        - data/preprocessed/obcina_vreme_processed.csv:
            cache: false