name: Fetch data on schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  fetch_air:
    name: Fetch and pre-process air data
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          clean: true
      - name: Setup Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Setup DVC remote
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc remote modify origin --local endpointurl https://dagshub.com/Jozela/IISProjekt.s3
          dvc remote modify origin --local use_ssl true
      - name: Pull existing data
        run: |
          dvc pull data/preprocessed/nesrece_v_cestnem_prometu.csv || true
          dvc pull data/preprocessed/obcina_vreme_processed.csv || true
      - name: Run DVC pipeline
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc repro --force
          dvc push
      - name: Commit DVC changes to Git
        run: |
          git add dvc.lock
          git commit -m "Fresh predictions $(date)" || echo "No changes to commit"
          git push || echo "Git push skipped"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/issprojekt:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/issprojekt:${{ github.run_number }}
      - name: Trigger Northflank redeploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/${{ secrets.NORTHFLANK_SERVICE_ID }}/deployment \
            -d "{\"external\":{\"imagePath\":\"${{ secrets.DOCKERHUB_USERNAME }}/issprojekt:latest\"}}"