name: Fetch data on schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  fetch_air:
    name: Fetch and pre-process air data
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Setup DVC remote
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc remote modify origin --local endpointurl https://dagshub.com/Jozela/IISProjekt.s3
          dvc remote modify origin --local use_ssl true

      - name: Pull existing data
        run: |
          dvc pull data/preprocessed/nesrece_v_cestnem_prometu.csv
          dvc pull data/preprocessed/obcina_vreme_processed.csv
          cp data/preprocessed/nesrece_v_cestnem_prometu.csv /tmp/nesrece_backup.csv || true
          cp data/preprocessed/obcina_vreme_processed.csv /tmp/vreme_backup.csv || true

      - name: Run DVC pipeline
        run: |
          dvc repro --force
          dvc push

      - name: Commit DVC changes
        run: |
          git add dvc.lock
          git commit -m "Update dvc.lock on $(date)" || echo "No changes to commit"
          git push || echo "Git push skipped"